<svg xmlns="http://www.w3.org/2000/svg" width="120" height="182" viewBox="-650 -1193 1300 1961" role="img" preserveAspectRatio="xMidYMid meet">
  <title>Loading</title>
  <desc>Animated logo loader: chevrons brighten in a downward wave while a light sheen sweeps down across them.</desc>
  <defs>
