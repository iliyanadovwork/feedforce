    </clipPath>
    <linearGradient id="ll-band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DFFFEA" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#DFFFEA" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#DFFFEA" stop-opacity="0"/>
    </linearGradient>
    <style>
      .seg{fill:#00CD40;animation:ll-casc 1.111s ease-in-out infinite}
      .s2{animation-delay:0.1s}.s4{animation-delay:0.2s}.s5{animation-delay:0.3s}.s3{animation-delay:0.4s}
      @keyframes ll-casc{0%,100%{opacity:0.3}40%{opacity:1}}
      .sweep{animation:ll-shim 1.111s linear infinite}
      @keyframes ll-shim{from{transform:translateY(0)}to{transform:translateY(3900px)}}
      @media (prefers-reduced-motion: reduce){
        .seg{animation:none;opacity:1}
        .sweep{display:none}
      }
    </style>
  </defs>

