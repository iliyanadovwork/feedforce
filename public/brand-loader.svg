      <path d="M-127.2 -653.6 L-536.1 -398.3 Q-615 -349 -615 -256 L-615 -256 Q-615 -163 -536.1 -212.3 L-127.2 -467.6 Q0 -547 127.2 -467.6 L536.1 -212.3 Q615 -163 615 -256 L615 -256 Q615 -349 536.1 -398.3 L127.2 -653.6 Q0 -733 -127.2 -653.6 Z"/>
      <path d="M127.2 653.6 L536.1 398.3 Q615 349 615 256 L615 256 Q615 163 536.1 212.3 L127.2 467.6 Q0 547 -127.2 467.6 L-536.1 212.3 Q-615 163 -615 256 L-615 256 Q-615 349 -536.1 398.3 L-127.2 653.6 Q0 733 127.2 653.6 Z"/>
