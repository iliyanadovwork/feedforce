<svg xmlns="http://www.w3.org/2000/svg" width="87.55" height="79.98" viewBox="20.26 21.01 87.55 79.98">
  <style>
    .b { transform-box: fill-box; transform-origin: center; animation: pulse .625s ease-in-out infinite; }
    .b2 { animation-delay: .075s; }
    .b3 { animation-delay: .15s; }
    @keyframes pulse { 0%, 70%, 100% { transform: scale(1); } 25% { transform: scale(1.17); } }
    @media (prefers-reduced-motion: reduce) { .b { animation: none; } }
  </style>
  <g fill="#ffffff">
    <g class="b"><ellipse cx="31" cy="83" rx="13" ry="8" transform="rotate(64 31 83)"/></g>
    <g class="b b2"><ellipse cx="56" cy="72" rx="24" ry="14" transform="rotate(64 56 72)"/></g>
    <g class="b b3"><ellipse cx="81" cy="61" rx="37" ry="18" transform="rotate(64 81 61)"/></g>
  </g>
</svg>
